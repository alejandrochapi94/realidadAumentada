<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Mi primera experiencia de realidad aumentada</title>

  <!-- Componente gratuito model-viewer -->
  <script
    type="module"
    src="https://cdn.jsdelivr.net/npm/@google/model-viewer/dist/model-viewer.min.js">
  </script>

  <style>
    body {
      margin: 0;
      padding: 24px;
      font-family: Arial, sans-serif;
      text-align: center;
      background: #f5f5f5;
    }

    h1 {
      margin-bottom: 8px;
    }

    p {
      max-width: 700px;
      margin: 0 auto 20px;
      line-height: 1.5;
    }

    model-viewer {
      width: 100%;
      max-width: 800px;
      height: 500px;
      margin: auto;
      background: white;
      border-radius: 16px;
    }

    .instruccion {
      margin-top: 16px;
      font-weight: bold;
    }
  </style>
</head>

<body>
  <h1>Exploración del espacio</h1>

  <p>
    Observa el modelo desde diferentes ángulos.
    Después, presiona el botón de realidad aumentada
    para colocarlo en el aula.
  </p>

  <model-viewer
    src="https://modelviewer.dev/shared-assets/models/Astronaut.glb"
    alt="Modelo tridimensional de un astronauta"
    ar
    ar-modes="scene-viewer webxr quick-look"
    camera-controls
    auto-rotate
    shadow-intensity="1"
    exposure="1">
  </model-viewer>

  <p class="instruccion">
    En el teléfono, presiona el ícono de realidad aumentada.
  </p>
</body>
</html>
