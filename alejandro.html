<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Realidad Aumentada - Alejandro</title>

    <!-- Model Viewer -->
    <script type="module"
        src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js">
    </script>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{

            background:linear-gradient(135deg,#111,#222,#000);
            color:white;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .contenedor{

            width:100%;
            max-width:900px;
            text-align:center;
            padding:20px;

        }

        h1{

            font-size:2.5em;
            margin-bottom:10px;

        }

        p{

            margin-bottom:25px;
            color:#dddddd;

        }

        model-viewer{

            width:100%;
            height:70vh;

            background:#1a1a1a;

            border-radius:20px;

            box-shadow:0px 0px 30px rgba(0,255,255,.3);

        }

        .botonAR{

            background:#00BCD4;
            color:white;
            border:none;
            padding:15px 35px;
            font-size:18px;
            border-radius:50px;
            margin-top:20px;
            cursor:pointer;
            transition:.3s;

        }

        .botonAR:hover{

            background:#0097A7;

        }

        footer{

            margin-top:20px;
            color:#888;

        }

    </style>

</head>

<body>

<div class="contenedor">

<h1>Realidad Aumentada</h1>

<p>
Presiona el botón para visualizar el modelo en tu espacio mediante Realidad Aumentada.
</p>

<model-viewer

    id="visor"

    src="alejandroAnimado.glb"

    ar

    ar-modes="scene-viewer webxr quick-look"

    camera-controls

    auto-rotate

    shadow-intensity="1"

    exposure="1"

    environment-image="neutral"

    style="background:#111;"

>

<button slot="ar-button" class="botonAR">

📱 Ver en Realidad Aumentada

</button>

</model-viewer>

<footer>

Desarrollado para actividades educativas.

</footer>

</div>

<script>

const visor = document.getElementById("visor");

visor.addEventListener("load",()=>{

    console.log("Modelo cargado correctamente.");

});

visor.addEventListener("error",(e)=>{

    console.log("No se pudo cargar el modelo.");

});

</script>

</body>

</html>
